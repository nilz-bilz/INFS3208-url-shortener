server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;
    location = /ui { return 301 /ui/; }
    location /ui/ { add_header Cache-Control "no-cache"; try_files $uri /ui/index.html; }
    location = /healthz { default_type text/plain; return 200 'ok'; }
    location = /readyz  { default_type text/plain; return 200 'ok'; }
}
