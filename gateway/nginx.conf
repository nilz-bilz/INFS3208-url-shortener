# Compose-only router that mimics the Kubernetes Ingress (spec section 6)
server {
    listen 80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;

    location /ui           { proxy_pass http://frontend:80; }
    location /api/auth     { proxy_pass http://shortener:8000; }
    location /api/links    { proxy_pass http://shortener:8000; }
    location /api/stats    { proxy_pass http://analytics-api:8000; }
    location /             { proxy_pass http://redirect:8000; }
}
