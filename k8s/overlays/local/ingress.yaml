# Local Ingress for kind, handled by the ingress-nginx controller (ingressClassName nginx).
# Same routing as the GKE Ingress: /ui to frontend, /api/auth and /api/links to shortener, /api/stats to
# analytics-api, everything else (including short codes) to redirect via the default backend.
# Reachable at http://localhost:8080 because kind-config.yaml maps host port 8080 to the control-plane
# node's port 80, where the controller listens.
# Author: Nihal Singh Atwal (student ID 49299175, nihalsingh.atwal@student.uq.edu.au)
# AI declaration: Written with assistance from Claude Code (Anthropic); reviewed and tested by the author.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shortener-ingress
spec:
  ingressClassName: nginx
  defaultBackend:
    service: {name: redirect, port: {number: 80}}
  rules:
  - http:
      paths:
      - {path: /ui,         pathType: Prefix, backend: {service: {name: frontend,      port: {number: 80}}}}
      - {path: /api/auth,   pathType: Prefix, backend: {service: {name: shortener,     port: {number: 80}}}}
      - {path: /api/links,  pathType: Prefix, backend: {service: {name: shortener,     port: {number: 80}}}}
      - {path: /api/stats,  pathType: Prefix, backend: {service: {name: analytics-api, port: {number: 80}}}}
      - {path: /,           pathType: Prefix, backend: {service: {name: redirect,      port: {number: 80}}}}
