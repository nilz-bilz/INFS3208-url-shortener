# GKE overlay. __PROJECT_ID__, __TAG__ and __BASE_URL__ are filled in by scripts/deploy-gke.sh (sed on the rendered output).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: urlshortener
resources:
- ../../base
- ingress.yaml
# Rewrite the local image names to Artifact Registry
images:
- {name: localhost/shortener, newName: australia-southeast1-docker.pkg.dev/__PROJECT_ID__/urlshortener/shortener, newTag: __TAG__}
- {name: localhost/redirect,  newName: australia-southeast1-docker.pkg.dev/__PROJECT_ID__/urlshortener/redirect,  newTag: __TAG__}
- {name: localhost/analytics, newName: australia-southeast1-docker.pkg.dev/__PROJECT_ID__/urlshortener/analytics, newTag: __TAG__}
- {name: localhost/frontend,  newName: australia-southeast1-docker.pkg.dev/__PROJECT_ID__/urlshortener/frontend,  newTag: __TAG__}
patches:
- target: {kind: ConfigMap, name: app-config}     # short links use the public address
  patch: |-
    - op: replace
      path: /data/BASE_URL
      value: __BASE_URL__
