# Non-secret settings (spec section 4). Secret app-secret and ConfigMap mysql-init are created by the deploy scripts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: shortener
  DB_USER: app
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  BASE_URL: http://localhost:8080          # overlays replace this
  SESSION_TTL_SECONDS: "86400"
  CACHE_TTL_SECONDS: "3600"
