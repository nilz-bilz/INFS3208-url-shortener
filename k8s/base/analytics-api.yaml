# analytics-api: statistics API (GET /api/stats/<code> and /api/stats/top).
# Role: read-only service behind the Ingress path /api/stats. Checks the session token in Redis, then
# aggregates the clicks table in MySQL for the caller's own links (total, web vs QR, last 7 days).
# Runs the same image as analytics-worker (localhost/analytics) with its default gunicorn command.
# Config: app-config ConfigMap (DB_*, REDIS_*) plus DB_PASSWORD from the app-secret Secret.
# Reliability: 2 replicas spread across nodes; /readyz (MySQL + Redis) gates traffic, /healthz restarts
# a hung container; rolling updates never drop below the desired count (maxUnavailable 0).
# Contains: Deployment and a ClusterIP Service (port 80 -> container port 8000).
# Author: Nihal Singh Atwal (student ID 49299175, nihalsingh.atwal@student.uq.edu.au)
# AI declaration: Written with assistance from Claude Code (Anthropic); reviewed and tested by the author.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: analytics-api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}   # zero-downtime rollouts
  template:
    metadata:
      labels: {app: analytics-api}
    spec:
      topologySpreadConstraints:                       # spread pods across nodes for reliability
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: {app: analytics-api}
      terminationGracePeriodSeconds: 30
      containers:
      - name: analytics-api
        image: localhost/analytics:v1
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8000}]
        envFrom: [{configMapRef: {name: app-config}}]
        env:
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: app-secret, key: DB_PASSWORD}}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 250m, memory: 256Mi}
        readinessProbe:
          httpGet: {path: /readyz, port: 8000}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: 8000}
          initialDelaySeconds: 10
          periodSeconds: 10
        lifecycle:
          preStop: {exec: {command: ["sleep", "5"]}}    # let the load balancer drain before exit
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-api
spec:
  selector: {app: analytics-api}
  ports:
  - port: 80
    targetPort: 8000
