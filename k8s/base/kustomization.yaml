# Kustomize base: lists the environment-neutral manifests and puts them all in the urlshortener namespace.
# Overlays (k8s/overlays/local, k8s/overlays/gke) build on this and only change image names, BASE_URL and the Ingress.
# Not included on purpose: Secret app-secret and ConfigMap mysql-init. The deploy scripts create them from
# .env and db/schema.sql, so no password or schema copy is committed here.
# Author: Nihal Singh Atwal (student ID 49299175, nihalsingh.atwal@student.uq.edu.au)
# AI declaration: Written with assistance from Claude Code (Anthropic); reviewed and tested by the author.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: urlshortener
resources:
- namespace.yaml
- config.yaml
- mysql.yaml
- redis.yaml
- shortener.yaml
- redirect.yaml
- analytics-api.yaml
- analytics-worker.yaml
- frontend.yaml
- hpa.yaml
