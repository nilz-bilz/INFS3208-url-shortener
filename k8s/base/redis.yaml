# Redis: three jobs in one small pod: link cache (link:<code>), sessions (session:<token>) and the
# click queue (list "clicks"). Backends reach it as REDIS_HOST=redis.
# Single replica with persistence disabled (--save "" --appendonly no): a restart clears sessions (users log in
# again), the cache (rebuilt from MySQL on demand) and any queued clicks. Readiness is a TCP check on 6379.
# Contains: Deployment and a ClusterIP Service (port 6379).
# Author: Nihal Singh Atwal (student ID 49299175, nihalsingh.atwal@student.uq.edu.au)
# AI declaration: Written with assistance from Claude Code (Anthropic); reviewed and tested by the author.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        args: ["--save", "", "--appendonly", "no"]   # no persistence: cache, sessions and queue only
        ports: [{containerPort: 6379}]
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 250m, memory: 256Mi}
        readinessProbe:
          tcpSocket: {port: 6379}
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app: redis}
  ports:
  - port: 6379
    targetPort: 6379
