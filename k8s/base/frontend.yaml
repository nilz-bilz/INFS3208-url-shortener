# frontend: static UI (index.html, app.js, style.css) served by nginx under /ui/.
# Role: the only user-facing page; it calls the other services through the Ingress with relative /api/... paths.
# Needs no environment variables, MySQL or Redis. nginx answers /healthz and /readyz itself, which also
# serves as the GKE load balancer health check path. 2 replicas, spread across nodes, zero-downtime updates.
# Contains: Deployment and a ClusterIP Service (port 80 -> container port 80).
# Author: Nihal Singh Atwal (student ID 49299175, nihalsingh.atwal@student.uq.edu.au)
# AI declaration: Written with assistance from Claude Code (Anthropic); reviewed and tested by the author.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels: {app: frontend}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}   # zero-downtime rollouts
  template:
    metadata:
      labels: {app: frontend}
    spec:
      topologySpreadConstraints:                       # spread pods across nodes for reliability
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: {app: frontend}
      terminationGracePeriodSeconds: 30
      containers:
      - name: frontend
        image: localhost/frontend:v1
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 80}]
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 250m, memory: 256Mi}
        readinessProbe:
          httpGet: {path: /readyz, port: 80}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: 80}
          initialDelaySeconds: 10
          periodSeconds: 10
        lifecycle:
          preStop: {exec: {command: ["sleep", "5"]}}    # let the load balancer drain before exit
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: {app: frontend}
  ports:
  - port: 80
    targetPort: 80
