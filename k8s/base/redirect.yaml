# redirect: the hot read-only path. Serves GET /<code> and is the Ingress default backend.
# Role: looks the code up in Redis (link:<code>), falls back to MySQL on a miss, queues a click event on the
# Redis list "clicks" and answers 302 with Cache-Control: no-store. Expired links return 404. A Redis or
# queue failure never causes a 500: it falls back to MySQL and skips the click.
# Scaling: the replicas field is omitted because the HPA (hpa.yaml) owns it (3 to 10). The 100m CPU request is the
# base for the HPA's 50% target; the 500m limit caps one pod.
# Reliability: spread across nodes, rolling updates with maxUnavailable 0, and a 5 s preStop sleep so the load
# balancer stops sending traffic before the pod exits.
# Contains: Deployment and a ClusterIP Service (port 80 -> container port 8000).
# Author: Nihal Singh Atwal (student ID 49299175, nihalsingh.atwal@student.uq.edu.au)
# AI declaration: Written with assistance from Claude Code (Anthropic); reviewed and tested by the author.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redirect
spec:
  # no replicas field: the HPA owns the replica count
  selector:
    matchLabels: {app: redirect}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}   # zero-downtime rollouts
  template:
    metadata:
      labels: {app: redirect}
    spec:
      topologySpreadConstraints:                       # spread pods across nodes for reliability
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: {app: redirect}
      terminationGracePeriodSeconds: 30
      containers:
      - name: redirect
        image: localhost/redirect:v1
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8000}]
        envFrom: [{configMapRef: {name: app-config}}]
        env:
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: app-secret, key: DB_PASSWORD}}
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        readinessProbe:
          httpGet: {path: /readyz, port: 8000}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: 8000}
          initialDelaySeconds: 10
          periodSeconds: 10
        lifecycle:
          preStop: {exec: {command: ["sleep", "5"]}}    # let the load balancer drain before exit
---
apiVersion: v1
kind: Service
metadata:
  name: redirect
spec:
  selector: {app: redirect}
  ports:
  - port: 80
    targetPort: 8000
