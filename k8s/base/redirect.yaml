apiVersion: apps/v1
kind: Deployment
metadata:
  name: redirect
spec:
  # no replicas field: the HPA owns the replica count
  selector:
    matchLabels: {app: redirect}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}   # zero-downtime rollouts
  template:
    metadata:
      labels: {app: redirect}
    spec:
      topologySpreadConstraints:                       # spread pods across nodes for reliability
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: {app: redirect}
      terminationGracePeriodSeconds: 30
      containers:
      - name: redirect
        image: localhost/redirect:v1
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8000}]
        envFrom: [{configMapRef: {name: app-config}}]
        env:
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: app-secret, key: DB_PASSWORD}}
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        readinessProbe:
          httpGet: {path: /readyz, port: 8000}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: 8000}
          initialDelaySeconds: 10
          periodSeconds: 10
        lifecycle:
          preStop: {exec: {command: ["sleep", "5"]}}    # let the load balancer drain before exit
---
apiVersion: v1
kind: Service
metadata:
  name: redirect
spec:
  selector: {app: redirect}
  ports:
  - port: 80
    targetPort: 8000
