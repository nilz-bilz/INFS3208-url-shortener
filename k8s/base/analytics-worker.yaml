# analytics-worker: click consumer (no HTTP API, no Service).
# Role: pops click events that the redirect service pushed onto the Redis list "clicks", inserts a row
# into the MySQL clicks table and increments links.click_count. This keeps redirects fast: counting
# happens asynchronously, and the worker scales independently of the stats API.
# Runs the analytics image with the command overridden to "python worker.py". Each event goes to exactly
# one worker, so 2 replicas are safe; an event can be lost if a worker dies mid-event (accepted for analytics).
# Liveness: an exec probe checks that /tmp/heartbeat (touched on every loop) is newer than 30 s.
# There is no readiness probe because the pod receives no traffic. SIGTERM finishes the current event,
# so rolling updates are clean (terminationGracePeriodSeconds 30).
# Author: Nihal Singh Atwal (student ID 49299175, nihalsingh.atwal@student.uq.edu.au)
# AI declaration: Written with assistance from Claude Code (Anthropic); reviewed and tested by the author.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-worker
spec:
  replicas: 2
  selector:
    matchLabels: {app: analytics-worker}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}   # zero-downtime rollouts
  template:
    metadata:
      labels: {app: analytics-worker}
    spec:
      topologySpreadConstraints:                       # spread pods across nodes for reliability
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: {app: analytics-worker}
      terminationGracePeriodSeconds: 30
      containers:
      - name: analytics-worker
        image: localhost/analytics:v1
        imagePullPolicy: IfNotPresent
        command: ["python", "worker.py"]
        envFrom: [{configMapRef: {name: app-config}}]
        env:
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: app-secret, key: DB_PASSWORD}}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 250m, memory: 256Mi}
        livenessProbe:                                  # worker touches /tmp/heartbeat every loop
          exec:
            command: ["python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/heartbeat') < 30 else 1)"]
          initialDelaySeconds: 15
          periodSeconds: 10
