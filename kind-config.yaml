# kind cluster: 1 control-plane (runs the ingress controller) + 2 workers.
# Ports 80/443 map to 8080/8443 on the host (rootless Podman cannot bind privileged ports).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - {containerPort: 80, hostPort: 8080, protocol: TCP}
  - {containerPort: 443, hostPort: 8443, protocol: TCP}
- role: worker
- role: worker
